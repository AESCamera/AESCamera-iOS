name: Generate unsigned IPA

# An unsigned IPA for sideloading: SideStore, AltStore or Sideloadly sign it with the
# installer's own Apple ID. Every push to master leaves it as a workflow artifact; a tag
# like v0.1 also publishes it on a GitHub release, which anyone can download.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test AESCore
        run: swift test --package-path AESCore
      - name: Archive without signing
        run: |
          xcodebuild archive \
            -project AESCamera.xcodeproj \
            -scheme AESCamera \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AESCamera.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/AESCamera.xcarchive/Products/Applications/AESCamera.app build/Payload/
          cd build && zip -qry AESCamera.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: AESCamera-unsigned-ipa
          path: build/AESCamera.ipa
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/AESCamera.ipa
          generate_release_notes: true
          body: |
            Unsigned build for sideloading. Install it with SideStore, AltStore or
            Sideloadly, which sign it with your own Apple ID. With a free Apple ID the
            app must be refreshed every 7 days.
